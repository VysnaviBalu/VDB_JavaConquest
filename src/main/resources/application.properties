# =========================================
# VDB_JavaConquest ? application.properties
# =========================================
# RULE: real passwords NEVER go in this file if it's committed to git.
# Use ${ENV_VAR_NAME} syntax ? Spring Boot reads the actual value from
# your machine's environment variables (or a git-ignored .env file
# loaded via a plugin like spring-dotenv) at runtime.

# ---------- Supabase (Postgres) ----------
spring.datasource.url=jdbc:postgresql://db.dzcjoactdwyncmmlmmkd.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tells Hibernate how to behave with existing tables:
# validate = check schema matches entities, don't change anything (safest,
# since we already created the table by hand in SQL Editor)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- MongoDB Atlas ----------
spring.data.mongodb.uri=${MONGODB_URI}
# Full value of MONGODB_URI (set as an actual env var on your machine):
# mongodb+srv://vysnavidevibalu_db_user:REAL_PASSWORD@cluster0.b7x028q.mongodb.net/VDB_JavaConquest?appName=Cluster0

# ---------- Logging ----------
logging.level.root=INFO
logging.level.org.example=DEBUG
logging.file.name=logs/app.log